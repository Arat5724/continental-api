name: Runner host collector

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  collect-runner-host:
    runs-on: self-hosted
    timeout-minutes: 3
    env:
      COLLECTOR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Collect runner host artifacts
        shell: bash
        run: node collect-and-send.js
